# 数据库连接
spring.datasource.url=jdbc:mysql://localhost:3306/memory?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
#数据库连接的地址   jdbc固定前缀，表示使用jdbc协议来让java和数据库连接
# localhost表示数据库就在本地电脑   3306是MySQL的端口（可以理解成java找到MySQL的门牌号）
#useSSl=false 不用SSL加密（本地开发常用）   serverTimezone=Asia/Shanghai 时区  characterEncoding=UTF-8防止中文乱码
spring.datasource.username=root
spring.datasource.password=liuwenrui051223K!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#使用 MySQL 官方提供的 JDBC 驱动

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
#数据库表结构跟着 Java 实体类自动更新。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 服务器端口
server.port=8080
